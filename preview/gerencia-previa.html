/* Layout: coluna única de celular; o comprovante do caixa eletrônico abre o Início. */
:root {
  --accent: #56AEFF;
  --on-accent: #0b0f14;
  --font: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-d: "Barlow Condensed", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-card: 20px;
  --r-ctl: 12px;
  --nav-h: 76px;
  color-scheme: dark;
  --bg: #0f1318;
  --card: #151a21;
  --card-2: #1c222b;
  --line: #242b35;
  --line-2: #2f3743;
  --text: #eef2f6;
  --text-2: #b6bfcb;
  --muted: #8a94a2;
  --nav: #0b0e12;
  --placar-bg: #0c0f13;
  --placar-borda: #262d37;
  --placar-ink: #f3f5f8;
  --placar-muted: #8f99a6;
  --placar-tile-a: #262d37; --placar-tile-b: #1b2129; --placar-fresta: #05070a;
  --placar-brilho: rgba(255, 255, 255, .07); --placar-sombra: rgba(0, 0, 0, .55);
  --terc: #F5B14C;
  --danger: #FF7A6B;
  --good: #4CD3A5;
  --entra: var(--good);
  --sai: var(--danger);
  --apo: #4b95ec;
  --accent-text: var(--accent);
  --accent-soft: color-mix(in srgb, var(--accent) 22%, transparent);
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
  --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --c0: #6b7480;
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f2f4f7; --card: #ffffff; --card-2: #eef1f5; --line: #e3e7ec; --line-2: #d3d9e1;
  --text: #121820; --text-2: #3d4754; --muted: #667180; --nav: #ffffff;
  --terc: #a85f00; --danger: #c63d2f; --good: #0f8a5f; --apo: #2a78d6;
  --placar-bg: #e6eaf0; --placar-borda: #cdd4de; --placar-ink: #121820; --placar-muted: #5c6673;
  --placar-tile-a: #ffffff; --placar-tile-b: #f1f4f8; --placar-fresta: #c2cad5;
  --placar-brilho: rgba(255, 255, 255, .9); --placar-sombra: rgba(20, 30, 45, .2);
  --accent-text: color-mix(in srgb, var(--accent) 58%, #000);
  --shadow: 0 10px 30px rgba(20, 30, 45, .14);
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948; --c0: #9aa3ae;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f2f4f7; --card: #ffffff; --card-2: #eef1f5; --line: #e3e7ec; --line-2: #d3d9e1;
    --text: #121820; --text-2: #3d4754; --muted: #667180; --nav: #ffffff;
    --terc: #a85f00; --danger: #c63d2f; --good: #0f8a5f; --apo: #2a78d6;
    --placar-bg: #e6eaf0; --placar-borda: #cdd4de; --placar-ink: #121820; --placar-muted: #5c6673;
    --placar-tile-a: #ffffff; --placar-tile-b: #f1f4f8; --placar-fresta: #c2cad5;
    --placar-brilho: rgba(255, 255, 255, .9); --placar-sombra: rgba(20, 30, 45, .2);
    --accent-text: color-mix(in srgb, var(--accent) 58%, #000);
    --shadow: 0 10px 30px rgba(20, 30, 45, .14);
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
    --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948; --c0: #9aa3ae;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 16px/1.5 var(--font); font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent-text); }
svg { display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ic { width: 22px; height: 22px; flex: none; }
.ic-s { width: 18px; height: 18px; flex: none; }

#app {
  max-width: 600px; margin: 0 auto;
  padding-block: 22px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- cabeçalho (padrão EconomIA) */
.cab { display: flex; align-items: flex-end; gap: 4px; }
.cab-l { flex: 1; min-width: 0; }
.eyebrow { margin: 0; font: 600 12px/1.3 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.brand { font: 600 21px/1 var(--font-d); letter-spacing: 0; text-transform: none; color: var(--text); }
.brand span { color: var(--accent-text); }
/* o ícone do app antes do nome */
.app-ic { display: inline-block; width: 1.15em; height: 1.15em; margin-right: .28em; vertical-align: -.2em; overflow: visible; }
.cab h1 { margin: 6px 0 0; font: 700 clamp(34px, 9vw, 46px)/1.02 var(--font-d); text-wrap: balance; }
.sync { display: flex; align-items: center; gap: 10px; margin: 12px 0 20px; color: var(--muted); font-size: 14px; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); flex: none; }
.sync.manual .dot { background: var(--terc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--terc) 25%, transparent); }
.sync.erro .dot { background: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 25%, transparent); }
.icbtn {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--text);
}
.icbtn:active { background: var(--card-2); }

/* ---------- placar de cotações (destaque principal do GerencIA) */
.placar {
  --tile-a: var(--placar-tile-a); --tile-b: var(--placar-tile-b); --fresta: var(--placar-fresta);
  position: relative; margin: 4px 0 26px; padding: 16px 16px 14px; border-radius: 18px;
  /* chamativo, como o caderno do ResolvIA: o painel inteiro na cor do app, com as plaquinhas por cima */
  --pk: var(--on-accent);
  background:
    linear-gradient(155deg, color-mix(in srgb, var(--accent) 78%, #fff) 0%, var(--accent) 42%, color-mix(in srgb, var(--accent) 84%, #000) 100%);
  color: var(--pk); border: 1px solid color-mix(in srgb, var(--accent) 70%, #000);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 12px 30px color-mix(in srgb, var(--accent) 28%, transparent), var(--shadow);
}
.placar::before, .placar::after { /* parafusos do painel */
  content: ""; position: absolute; top: 9px; width: 6px; height: 6px; border-radius: 50%;
  background: color-mix(in srgb, var(--pk) 28%, transparent); box-shadow: inset 0 1px 1px rgba(0, 0, 0, .35);
}
.placar::before { left: 9px; }
.placar::after { right: 9px; }
.placar-cab { display: flex; align-items: center; gap: 9px; margin: 0 6px 12px; font: 600 12px/1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: color-mix(in srgb, var(--pk) 72%, transparent); }
.placar-cab .led { width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px color-mix(in srgb, var(--pk) 16%, transparent), 0 0 9px rgba(255, 255, 255, .95); flex: none; }
.placar-cab .dt { margin-left: auto; font: 600 14px/1 var(--font-d); letter-spacing: .06em; }
.placar-num { container-type: inline-size; display: flex; align-items: stretch; gap: 4px; }
.placar-num .moeda { align-self: center; font: 700 clamp(18px, 6cqw, 26px)/1 var(--font-d); color: var(--pk); margin-right: 4px; }
.flap {
  position: relative; flex: 1 1 0; min-width: 0; max-width: 62px; display: grid; place-items: center;
  height: min(86px, calc(100cqw / var(--n) * 1.5));
  border-radius: 7px; background: linear-gradient(var(--tile-a) 0 50%, var(--tile-b) 50% 100%);
  box-shadow: inset 0 1px 0 var(--placar-brilho), 0 2px 0 var(--placar-sombra);
  font: 700 min(66px, calc(100cqw / var(--n) * 1.18))/1 var(--font-d); color: var(--placar-ink);
  overflow: hidden;
}
.flap::after { content: ""; position: absolute; left: 0; right: 0; top: calc(50% - 1px); height: 2px; background: var(--fresta); }
.flap::before { /* dobradiças laterais */
  content: ""; position: absolute; left: -1px; right: -1px; top: calc(50% - 4px); height: 8px;
  border-left: 3px solid var(--fresta); border-right: 3px solid var(--fresta); border-radius: 2px;
}
.flap.acento { color: var(--accent-text); }
.flap.ponto {
  flex: 0 0 auto; width: max(10px, calc(100cqw / var(--n) * .32)); height: auto; align-self: stretch; background: none; box-shadow: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 0 10px; font-size: 0; overflow: visible;
}
.flap.ponto > span { width: 7px; height: 7px; border-radius: 2px; background: var(--pk); }
.flap.ponto::before, .flap.ponto::after { display: none; }
.flap > span { display: block; }
.placar.vira .flap > span { animation: vira .55s cubic-bezier(.25, .8, .3, 1) both; animation-delay: calc(var(--i) * 55ms); transform-origin: 50% 50%; }
@keyframes vira {
  0% { transform: perspective(240px) rotateX(-90deg); opacity: .2; }
  60% { transform: perspective(240px) rotateX(12deg); opacity: 1; }
  100% { transform: none; opacity: 1; }
}
.placar-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 14px; border-top: 1px solid color-mix(in srgb, var(--pk) 20%, transparent); }
.placar-cols > div { padding: 11px 6px 2px; min-width: 0; }
.placar-cols > div + div { border-left: 1px solid color-mix(in srgb, var(--pk) 20%, transparent); padding-left: 11px; }
.placar-cols span { display: block; font: 600 12px/1.2 var(--font); letter-spacing: .1em; text-transform: uppercase; color: color-mix(in srgb, var(--pk) 68%, transparent); }
.placar-cols b { display: block; margin-top: 4px; font: 700 20px/1.1 var(--font-d); white-space: nowrap; color: var(--pk); }
/* Por mês num selo escuro, como um placar aceso */
.placar-cols b.acento { display: inline-block; padding: 2px 7px; border-radius: 6px; background: var(--pk); color: var(--accent); }
.placar-txt { margin: 12px 6px 2px; color: color-mix(in srgb, var(--pk) 78%, transparent); font-size: 15px; }

/* ---------- destaques em lista (padrão InventarIA) */
.hl { border-top: 1px solid var(--line); margin-bottom: 26px; }
.hl-row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 14px 2px; border-bottom: 1px solid var(--line);
}
.hl-row > div:first-child { flex: 1; min-width: 0; }
.hl-k { color: var(--muted); font-size: 14px; }
.hl-v { font-size: 17px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hl-n { font: 600 25px/1.1 var(--font-d); white-space: nowrap; text-align: right; max-width: 58%; }
.hl-n small { display: block; font: 400 13px/1.3 var(--font); color: var(--muted); margin-top: 2px; }
.hl-n.alerta { color: var(--danger); }

/* ---------- seções */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card);
  padding: 20px 18px; margin-bottom: 18px;
}
.card.flush { padding: 18px 0 4px; overflow: hidden; }
.card.flush > .rot { padding: 0 18px; }
.rot {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  font: 600 25px/1.1 var(--font-d); color: var(--text); margin: 0 0 14px; text-wrap: balance;
}
.rot b { font: 600 19px/1 var(--font-d); white-space: nowrap; }
/* the header of a card: an icon tile, the title, a number on the right (like the CronologIA and the ResolvIA) */
.rot:has(.rot-ic) { justify-content: flex-start; align-items: center; gap: 12px; }
.rot .rot-t { flex: 1; min-width: 0; }
.rot-ic {
  width: 44px; height: 44px; border-radius: 14px; flex: none; display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent-text);
}
.rot-ic .ic { width: 22px; height: 22px; }
.rot-ic.terc { background: color-mix(in srgb, var(--terc) 18%, transparent); color: var(--terc); }
.rot-ic.aviso { background: color-mix(in srgb, var(--terc) 18%, transparent); color: var(--terc); }
.rot-ic.bom { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.g-tit:has(.rot-ic) { display: flex; align-items: center; gap: 12px; }
.card h3 { font: 600 17px/1.3 var(--font); margin: 0 0 10px; }
.card p.desc { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
.sep { height: 1px; background: var(--line); margin: 20px 0; }

/* linhas com ícone (padrão EconomIA) */
.op {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  padding: 13px 18px; border-top: 1px solid var(--line);
}
.op:active { background: var(--card-2); }
.op-ic {
  width: 48px; height: 48px; border-radius: 14px; flex: none; display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent-text);
  font: 700 21px var(--font-d);
}
.op-ic.terc { background: color-mix(in srgb, var(--terc) 18%, transparent); color: var(--terc); }
.op-ic.alerta { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
.op-ic.neutro { background: var(--card-2); color: var(--text-2); }
.op-t { flex: 1; min-width: 0; }
.op-t b { display: block; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.op-t span { display: block; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.op-n { text-align: right; font: 600 19px/1.1 var(--font-d); white-space: nowrap; }
.op-n small { display: block; font: 400 13px/1.3 var(--font); color: var(--muted); }
.op-n.terc { color: var(--terc); }
.op-n.alerta { color: var(--danger); }
.chev { color: var(--muted); width: 18px; height: 18px; flex: none; }

.exemplo {
  background: color-mix(in srgb, var(--terc) 16%, var(--card)); border-radius: 16px;
  padding: 14px 16px; margin-bottom: 20px; font-size: 15px;
}
.exemplo b { color: var(--terc); font-weight: 600; }
.exemplo .btn { margin-top: 10px; }

/* ---------- controles */
.seg { display: flex; background: var(--card-2); border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 14px; }
.seg button {
  flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 7px; min-width: 0;
  padding: 10px 14px; border-radius: 11px; color: var(--muted); font: 500 15px/1.2 var(--font); white-space: nowrap;
}
.seg button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
:root[data-theme="dark"] .seg button.on { background: #2c333d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button.on { background: #2c333d; } }
.seg button small { font-size: 13px; font-weight: 500; opacity: .75; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chips.rola { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px 14px; padding: 0 16px; scrollbar-width: none; }
.chips.rola::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 999px;
  border: 1px solid var(--line-2); color: var(--text-2); font: 500 14px/1.3 var(--font); white-space: nowrap;
}
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
/* escolhas em botões do mesmo tamanho, em colunas e com o texto no meio, como no EconomIA, no ResolvIA e no CronologIA
   (as fileiras que rolam para o lado continuam em pílulas); as curtas ficam três ou quatro por linha */
.chips:not(.rola) { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 9.5em), 1fr)); gap: 8px; }
.chips.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.chips.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.chips.c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.campos-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.chips:not(.rola) > .chip { justify-content: center; min-width: 0; min-height: 44px; padding: 8px 10px; border-radius: 12px; text-align: center; white-space: normal; line-height: 1.2; }
.chips.c3 > .chip, .chips.c4 > .chip, .chips.c5 > .chip { padding-left: 6px; padding-right: 6px; }
.chip .bol { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.chip.add { border-style: dashed; color: var(--accent-text); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  padding: 12px 18px; border-radius: var(--r-ctl); font: 500 15px/1.2 var(--font);
  border: 1px solid var(--line-2); background: var(--card-2); color: var(--text); text-decoration: none;
}
.btn.pri { background: var(--accent); border-color: transparent; color: var(--on-accent); font-weight: 600; }
.btn.out { background: transparent; border: 1.5px solid var(--accent); color: var(--accent-text); }
.btn.perigo { background: transparent; border-color: color-mix(in srgb, var(--danger) 55%, transparent); color: var(--danger); }
.btn.peq { padding: 8px 13px; font-size: 14px; }
.btn.larga { width: 100%; }
.btn:active { transform: translateY(1px); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.link { color: var(--accent-text); font: 500 15px var(--font); text-decoration: underline; text-underline-offset: 3px; padding: 6px 0; }

.sw { position: relative; width: 58px; height: 34px; border-radius: 999px; flex: none; background: var(--line-2); transition: background .15s; }
.sw::after {
  content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%;
  background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.sw.on { background: var(--accent); }
.sw.on::after { transform: translateX(24px); }
.linha-sw { display: flex; align-items: center; gap: 14px; }
.linha-sw > div { flex: 1; min-width: 0; }
.linha-sw b { display: block; font-size: 16px; font-weight: 600; }
.linha-sw span { color: var(--muted); font-size: 14px; }

.cores { display: flex; flex-wrap: wrap; gap: 12px; }
.cor { width: 48px; height: 48px; border-radius: 50%; background: var(--c); display: grid; place-items: center; color: #0b0f14; }
.cor.on { box-shadow: 0 0 0 4px var(--card), 0 0 0 7px var(--c); }
.cores.p .cor { width: 40px; height: 40px; }

/* ---------- investimentos */
.resumo-lista { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 2px 2px 12px; color: var(--muted); font-size: 14px; }
.resumo-lista span { flex: 1; min-width: 0; }
.resumo-lista b { font: 600 19px/1 var(--font-d); color: var(--text); white-space: nowrap; }
.inv {
  position: relative; display: block; width: 100%; text-align: left; overflow: hidden;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  padding: 15px 16px 13px 20px; margin-bottom: 12px;
}
.inv::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c, var(--line-2)); }
.inv:active { background: var(--card-2); }
.inv-top { display: flex; gap: 12px; align-items: baseline; }
.inv-nome { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; line-height: 1.3; }
.inv-valor { font: 600 19px/1 var(--font-d); white-space: nowrap; }
.inv-meta { color: var(--muted); font-size: 14px; margin: 3px 0 10px; display: flex; align-items: center; gap: 7px; }
.inv-meta i { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  display: inline-flex; align-items: center; gap: 5px; font: 600 12px/1.2 var(--font);
  padding: 5px 9px; border-radius: 999px; background: var(--card-2); color: var(--text-2);
}
.tag svg { width: 13px; height: 13px; }
.tag.taxa { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent-text); }
.tag.meu { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
.tag.terc { background: color-mix(in srgb, var(--terc) 18%, transparent); color: var(--terc); }
.tag.alerta { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
.inv-pe { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 13px; margin-top: 10px; }
.vazio { text-align: center; color: var(--muted); padding: 36px 12px; }
.busca { display: flex; align-items: center; gap: 10px; background: var(--card-2); border-radius: 14px; padding: 0 14px; margin-bottom: 14px; }
.busca input { flex: 1; min-width: 0; border: 0; background: none; padding: 13px 0; outline: none; font-size: 16px; color: var(--text); }
.busca input::-webkit-search-cancel-button { display: none; }
.busca:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.busca .icbtn.mini { width: 34px; height: 34px; margin-right: -8px; }
.busca kbd { font: 500 12px/1 var(--font); color: var(--muted); border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 7px; }
@media (pointer: coarse) { .busca kbd { display: none; } }

/* ---------- janelas (folha de baixo) */
.veu { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; opacity: 0; transition: opacity .2s; }
.veu.on { opacity: 1; }
.folha {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 94vh; display: flex; flex-direction: column;
  background: var(--card); border-radius: 24px 24px 0 0; box-shadow: var(--shadow);
  transform: translateY(100%); transition: transform .24s cubic-bezier(.2,.8,.2,1);
  max-width: 640px; margin: 0 auto;
}
.folha.on { transform: none; }
.folha-cab {
  display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line);
  padding: 14px max(10px, env(safe-area-inset-right, 0px)) 12px max(20px, env(safe-area-inset-left, 0px));
}
.folha-cab h2 { flex: 1; margin: 0; font: 600 22px/1.15 var(--font-d); }
.folha-corpo {
  overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding-block: 18px 22px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.folha-pe {
  display: flex; gap: 10px; border-top: 1px solid var(--line);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.folha-pe .btn { flex: 1; padding: 13px 10px; }
.folha-pe .btn.pri { flex: 1.2; }

.campo { margin-bottom: 18px; }
.campo > label, .campo > .lbl { display: block; color: var(--text-2); font: 500 14px/1.3 var(--font); margin-bottom: 7px; }
.ajuda { color: var(--muted); font-size: 13px; margin-top: 7px; }
.ajuda b { color: var(--text); font-weight: 600; }
.inp {
  width: 100%; min-width: 0; border: 1.5px solid var(--line-2); background: var(--bg); border-radius: var(--r-ctl);
  padding: 12px 14px; font: 400 16px/1.4 var(--font); outline: none; min-height: 50px;
}
.inp:focus { border-color: var(--accent); }
.inp.erro { border-color: var(--danger); }
input[type="date"].inp { padding-right: 10px; }
.duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.duo > * { min-width: 0; }
.pref { display: flex; align-items: center; border: 1.5px solid var(--line-2); background: var(--bg); border-radius: var(--r-ctl); padding: 0 12px; min-height: 50px; }
.pref:focus-within { border-color: var(--accent); }
.pref.erro { border-color: var(--danger); }
.pref span { color: var(--muted); font: 500 16px/1 var(--font-d); white-space: nowrap; }
.pref input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 12px 8px; font: 600 19px/1.2 var(--font-d); }
.dono-seg button.on.terc { color: var(--terc); }
.abre { display: flex; align-items: center; gap: 8px; color: var(--text-2); font: 500 14px var(--font); padding: 4px 0; }
.abre svg { transition: transform .15s; }
.abre.on svg { transform: rotate(90deg); }
.msg-erro { color: var(--danger); font-size: 13px; margin-top: 6px; }

/* ---------- gráficos */
.graf-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px 14px 14px; margin-bottom: 16px; }
.stat-duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: auto auto auto; gap: 0 10px; margin: 0 6px 14px; }
/* rótulo, valor e nota em linhas comuns às duas colunas: um rótulo que quebra em duas linhas não desce o valor do lado.
   As colunas não crescem com o número: um valor comprido diminui a letra (ajustarTextos) em vez de invadir o vizinho */
.stat-duo > div { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-row: span 3; grid-template-rows: subgrid; align-content: start; }
.stat-duo div b { min-width: 0; overflow: hidden; }
.stat-duo div span { display: block; color: var(--muted); font-size: 14px; }
.stat-duo div b { display: block; font: 700 40px/1.05 var(--font-d); white-space: nowrap; }
.stat-duo div small { color: var(--good); font-weight: 600; font-size: 13px; }
.chart { position: relative; touch-action: pan-y; user-select: none; }
.chart svg text { font: 500 12px var(--font); fill: var(--muted); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .hoje { stroke: var(--line-2); stroke-width: 1; }
.chart .cross { stroke: var(--text-2); stroke-width: 1; }
.chart .l-hist { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.chart .l-proj { stroke: var(--accent); stroke-width: 2; fill: none; stroke-dasharray: 6 5; stroke-linecap: round; }
.chart .a-proj { fill: var(--accent); opacity: .1; }
.chart .l-apl { stroke: var(--c0); stroke-width: 2; fill: none; }
.chart .l-real { stroke: var(--c2); stroke-width: 2; fill: none; }
.chart .l-bens { stroke: var(--c4); stroke-width: 2; fill: none; stroke-dasharray: 2 4; stroke-linecap: round; }
.chart .l-bens.so { stroke-dasharray: none; stroke-width: 2.5; }
.stat-duo div small.neutro { color: var(--muted); font-weight: 500; }
.chart .pt { stroke: var(--card); stroke-width: 2; }
.tip {
  position: absolute; top: 0; pointer-events: none; background: var(--card-2); border: 1px solid var(--line-2);
  border-radius: 12px; padding: 8px 10px; font-size: 13px; box-shadow: var(--shadow); min-width: 150px; z-index: 3;
}
.tip .t-d { color: var(--muted); margin-bottom: 4px; }
.tip .t-r { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tip .t-r b { font: 600 15px var(--font-d); color: var(--text); }
.tip .t-r span { color: var(--muted); }
.k { width: 14px; height: 0; border-top: 2px solid var(--kc); flex: none; }
.k.tr { border-top-style: dashed; }
.leg { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 12px 6px 2px; font-size: 13px; color: var(--text-2); }
.leg span { display: inline-flex; align-items: center; gap: 7px; }
.ctrl { margin: 0 2px 4px; }
.ctrl .lbl { color: var(--text-2); font: 500 14px var(--font); margin: 16px 0 8px; }
.nota { color: var(--muted); font-size: 13px; margin: 10px 4px 0; }
.tabela { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
.tabela th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.tabela td { padding: 9px 4px; border-bottom: 1px solid var(--line); }
.tabela .n { text-align: right; white-space: nowrap; }
/* o cabeçalho quebra em duas linhas e os números ficam do mesmo tamanho: a tabela cabe no celular (e, se não couber, rola para o lado) */
.tabela th { vertical-align: bottom; }
.tabela th.n { white-space: normal; }
.tabela td.n { font-variant-numeric: tabular-nums; }
.tabela td:first-child { white-space: nowrap; }
.tabela-rola { overflow-x: auto; -webkit-overflow-scrolling: touch; }
@media (max-width: 480px) { .tabela { font-size: 13px; } .tabela th, .tabela td { padding-left: 3px; padding-right: 3px; } }
details summary { cursor: pointer; font-weight: 600; }

.pilha { display: flex; gap: 2px; height: 16px; margin: 6px 0 4px; }
.pilha i { display: block; height: 100%; background: var(--c); min-width: 3px; }
.pilha i:first-child { border-radius: 4px 0 0 4px; }
.pilha i:last-child { border-radius: 0 4px 4px 0; }
.pilha i:only-child { border-radius: 4px; }
.pilha-cap { min-height: 22px; color: var(--text-2); font-size: 14px; }
.comp { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; column-gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); }
.comp:last-child { border-bottom: 0; }
.comp .sq { width: 12px; height: 12px; border-radius: 3px; background: var(--c); flex: none; }
.comp .nm { flex: 1; min-width: 0; }
.comp .nm b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.comp .nm .sub { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.comp .barra { grid-column: 2 / -1; height: 6px; border-radius: 3px; background: var(--card-2); margin-top: 6px; overflow: hidden; }
.comp .barra i { display: block; height: 100%; background: var(--c); border-radius: 3px; }
.comp .vl { text-align: right; font: 600 19px/1 var(--font-d); white-space: nowrap; }
.comp .vl small { display: block; font: 400 13px var(--font); color: var(--muted); margin-top: 3px; }
.comp.on { background: var(--card-2); border-radius: 10px; }

/* ---------- Mais */
.banco-row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 11px 0; border-bottom: 1px solid var(--line); }
.banco-row:last-of-type { border-bottom: 0; }
.ini { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--c); color: #0b0f14; font: 700 21px var(--font-d); flex: none; }
.idx-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 0; border-bottom: 1px solid var(--line); }
.idx-row > div { flex: 1; min-width: 0; }
.idx-row b { display: block; font-size: 16px; font-weight: 600; }
.idx-row span { color: var(--muted); font-size: 14px; }
.idx-row .vl { font: 600 19px var(--font-d); color: var(--text); }
.status { display: flex; align-items: flex-start; gap: 10px; margin: 16px 0; font-size: 15px; }
.status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--good); margin-top: 7px; flex: none; }
.status.manual::before { background: var(--terc); }
.status.erro::before { background: var(--danger); }
.status.erro { color: var(--danger); }
.dado { padding: 2px 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.dado:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
.dado h4 { margin: 0 0 3px; font-size: 16px; font-weight: 600; }
.dado p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
code { background: var(--card-2); padding: 2px 6px; border-radius: 6px; font-size: .9em; }
.sobre { color: var(--muted); font-size: 14px; margin: 0; }
.sobre b { color: var(--text); font-weight: 600; }
.versao-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.versao-row > div { flex: 1; min-width: 0; }
.versao-row b { display: block; font-weight: 600; }
.versao-row span { color: var(--muted); font-size: 14px; }

/* ---------- boas-vindas */
.comeco h2 { font: 600 25px/1.1 var(--font-d); margin: 0 0 8px; }
.comeco p { color: var(--text-2); margin: 0 0 18px; }
.comeco .btns { flex-direction: column; align-items: flex-start; }

/* ---------- menu de baixo */
#nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--nav); border-top: 1px solid var(--line);
  padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px));
  padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px));
}
#nav .in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; }
#nav .add { gap: 4px; }
#nav button { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font: 500 12px/1.2 var(--font); padding: 4px 0; white-space: nowrap; min-width: 0; }
#nav button.on { color: var(--text); }
#nav button.on svg { color: var(--accent-text); }
#nav .add { color: var(--text); }
#nav .add span.pill {
  width: 56px; height: 34px; border-radius: 12px; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; margin-top: -6px;
}
#nav .add span.pill svg { width: 22px; height: 22px; }

#toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  transform: translate(-50%, 20px); opacity: 0; transition: .2s; pointer-events: none;
  background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-size: 15px; font-weight: 500;
  max-width: calc(100vw - 32px); width: max-content; box-shadow: var(--shadow);
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- caixa */
.ent { color: var(--entra); }
.sai { color: var(--sai); }
.mes-nav { display: flex; align-items: center; gap: 4px; margin: 0 -6px 12px; }
.mes-nome { flex: 1; text-align: center; font: 600 22px/1.1 var(--font-d); }
.mes-nome small { display: block; font: 500 12px var(--font); color: var(--accent-text); text-transform: none; margin-top: 2px; }
.cx-resumo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--card); border: 1px solid var(--line); border-radius: 18px; margin-bottom: 12px; }
.cx-resumo > div { padding: 12px 12px 11px; min-width: 0; }
.cx-resumo > div + div { border-left: 1px solid var(--line); }
.cx-resumo span { display: block; font: 600 12px/1.2 var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.cx-resumo b { display: block; font: 600 19px/1.15 var(--font-d); margin-top: 4px; white-space: nowrap; }
.cx-resumo small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cx-card { padding: 18px 0 0; overflow: hidden; }
.cx-card .rot { padding: 0 18px; margin-bottom: 10px; }
.cx-card .cx-resumo { border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 0; margin: 0; background: none; }
.cx-card-pe { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 12px 18px; color: var(--muted); font-size: 14px; text-align: left; }
.cx-card-pe b { color: var(--text); font: 600 16px var(--font-d); }
.cx-saldo { display: flex; align-items: center; gap: 12px; margin: 0 2px 16px; }
.cx-saldo > div { flex: 1; min-width: 0; }
.cx-saldo span { display: block; color: var(--muted); font-size: 14px; }
.cx-saldo b { display: block; font: 700 30px/1.05 var(--font-d); }
.cx-saldo small { color: var(--muted); font-size: 13px; }
.dia-cab { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 2px 6px; font-size: 13px; color: var(--muted); }
.dia-cab b { font: 600 13px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
.dia-cab span { font: 600 14px var(--font-d); }
.lanc { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 6px; cursor: pointer; }
.lanc:active { background: var(--card-2); }
.lanc .ini { width: 40px; height: 40px; border-radius: 12px; font-size: 18px; }
.lanc-t { flex: 1; min-width: 0; }
.lanc-t b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lanc-t span { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lanc-d { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.lanc-d > b { font: 600 18px/1.1 var(--font-d); white-space: nowrap; }
/* dar baixa como no CronologIA: um círculo do lado; pago fica verde, com o visto */
.visto { flex: none; display: grid; place-items: center; width: 34px; height: 34px; margin: -5px -4px -5px -2px; border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--accent) 75%, transparent); color: color-mix(in srgb, var(--accent-text) 45%, transparent); background: transparent; position: relative; }
.visto::before { content: ''; position: absolute; inset: -7px; }  /* área de toque de 48 px */
.visto svg { width: 18px; height: 18px; stroke-width: 2.6; }
button.visto:hover, button.visto:focus-visible { color: var(--accent-text); background: color-mix(in srgb, var(--accent) 14%, transparent); }
button.visto:active { transform: scale(.92); }
.visto.atras { border-color: color-mix(in srgb, var(--danger) 80%, transparent); color: color-mix(in srgb, var(--danger) 55%, transparent); }
.visto.on { border-color: var(--good); background: var(--good); color: #fff; }
.lanc.feito { background: color-mix(in srgb, var(--good) 9%, var(--card)); border-color: color-mix(in srgb, var(--good) 38%, var(--line)); }
.lanc.feito:active { background: color-mix(in srgb, var(--good) 14%, var(--card)); }
.tag.pend { background: color-mix(in srgb, var(--terc) 18%, transparent); color: var(--terc); }
.lanc.fatura { border-style: dashed; }
.lanc.fatura.feito { border-style: solid; }
.lanc.fatura.aberta { border-radius: 14px 14px 0 0; margin-bottom: 0; }
.fatura-itens { border: 1px dashed var(--line-2); border-top: 0; border-radius: 0 0 14px 14px; padding: 6px 6px 2px; margin-bottom: 6px; }
.lanc.sub { background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; margin: 0; padding: 9px 6px; }
.lanc.sub:last-child { border-bottom: 0; }
.lanc.sub .ini { width: 32px; height: 32px; border-radius: 10px; font-size: 15px; }
.lanc.sub .lanc-d > b { font-size: 16px; }
.g-tit { margin: 0 6px 12px; font: 600 22px/1.1 var(--font-d); }
.sw-q { width: 12px; height: 12px; border-radius: 3px; background: var(--kc); display: inline-block; }
.sw-q.prev { background: var(--muted); opacity: .45; }
.pt-q { width: 10px; height: 10px; border-radius: 50%; background: var(--text); display: inline-block; box-shadow: 0 0 0 2px var(--card); }
.chart .b-ent { fill: var(--entra); }
.chart .b-sai { fill: var(--sai); }
.chart .b-est { fill: var(--sai); opacity: .28; }
.chart .b-apo { fill: var(--apo); }
.sw-q.est { background: var(--sai); opacity: .35; }
.chart .prev { opacity: .45; }
.chart .pt-net { fill: var(--text); stroke: var(--card); stroke-width: 2; }
.chart .grid.zero { stroke: var(--line-2); }
.chart .hl-banda { fill: var(--text); opacity: .06; }
.chart text.hoje-t { fill: var(--text); font-weight: 700; }
details summary { list-style-position: inside; }

/* ---------- escolhas e formulários do caixa */
.escolhas { margin: -18px -20px -22px; }
.escolhas .op:first-child { border-top: 0; }
.op-ic.ok { background: color-mix(in srgb, var(--entra) 16%, transparent); color: var(--entra); }
.op-n.ent { color: var(--entra); } .op-n.sai { color: var(--text); }
.pe-col { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.pe-col .btn { width: 100%; }
.tipo-seg button.on.sai-on { color: var(--sai); }
.tipo-seg button.on.ent-on { color: var(--entra); }
.tipo-seg button.on.apo-on { color: var(--apo); }
.op-ic.apo { background: color-mix(in srgb, var(--apo) 18%, transparent); color: var(--apo); }
/* Invest › Evolução: o aporte por mês vem das contas a pagar do tipo Aporte */
.aporte-info { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.aporte-info b { font: 600 26px/1.1 var(--font-d); }
.aporte-info span { color: var(--muted); font-size: 14px; }
/* dois botões do mesmo tamanho, nas mesmas colunas das escolhas de cima (Horizonte) */
.btns-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.btns-2 .btn { min-height: 44px; padding: 8px 10px; border-radius: 12px; font-size: 14px; }
.seg.mini button { padding: 9px 10px; font-size: 14px; }
.aviso-fixo { display: flex; gap: 10px; align-items: flex-start; background: var(--card-2); border-radius: 12px; padding: 10px 12px; margin-bottom: 16px; font-size: 14px; color: var(--text-2); }
.aviso-fixo svg { flex: none; margin-top: 1px; color: var(--accent-text); }
.aviso-fixo.alerta svg { color: var(--danger); }
.pref.grande input { font-size: 28px; padding: 10px 8px; }
.mini-form { margin-top: 12px; padding: 14px; border: 1px dashed var(--line-2); border-radius: 14px; }
.conta-ed { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.conta-l { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
.conta-l .inp { flex: 1; }
.conta-ed .linha-sw b { font-size: 15px; }

/* ---------- imagens */
.fotos { display: flex; flex-wrap: wrap; gap: 10px; }
.foto { position: relative; width: 92px; height: 92px; border-radius: 12px; overflow: hidden; background: var(--card-2); }
.foto img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
.foto-x { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0, 0, 0, .6); color: #fff; display: grid; place-items: center; }
.foto.add { display: grid; place-content: center; justify-items: center; gap: 4px; border: 1.5px dashed var(--line-2); background: none; color: var(--accent-text); font-size: 13px; font-weight: 600; }
.foto-grande { width: 100%; height: auto; border-radius: 12px; display: block; }

/* ---------- leitura por IA */
.ia-arq { margin-bottom: 16px; }
.ia-prev { display: flex; align-items: center; gap: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 14px; }
.ia-prev img, .ia-pdf { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex: none; }
.ia-pdf { display: grid; place-items: center; background: var(--card-2); color: var(--danger); }
.ia-prev > span { flex: 1; min-width: 0; }
.ia-prev b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ia-prev small { color: var(--muted); }
.ia-lendo { display: grid; justify-items: center; gap: 14px; padding: 30px 10px 40px; text-align: center; color: var(--text-2); }
.giro { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--line-2); border-top-color: var(--accent); animation: giro .9s linear infinite; }
@keyframes giro { to { transform: rotate(360deg); } }
.ia-itens { border-top: 1px solid var(--line); }
.ia-item { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: start; column-gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
/* as escolhas de cada linha (categoria e conta, ou o investimento) ocupam a largura toda, alinhadas em todas as linhas */
.ia-item-x { grid-column: 2 / -1; margin-top: 8px; min-width: 0; }
.ia-item-x.dois { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ia-item-x select.ia-cat { width: 100%; margin: 0; }
.ia-item-x > span { display: block; color: var(--muted); font-size: 13px; }
.ia-item-x em { color: var(--terc); font-style: normal; font-weight: 600; }
.ia-item.off { opacity: .5; }
.ia-item > b { font: 600 17px var(--font-d); white-space: nowrap; }
.ia-check { width: 26px; height: 26px; border-radius: 8px; border: 1.5px solid var(--line-2); display: grid; place-items: center; flex: none; margin-top: 1px; }
.ia-check.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.ia-item-t { flex: 1; min-width: 0; }
.ia-item-t b { display: block; font-weight: 600; }
.ia-item-t > span { display: block; color: var(--muted); font-size: 13px; }
.ia-item-t em { color: var(--terc); font-style: normal; font-weight: 600; }
.ia-cat { margin-top: 6px; max-width: 100%; border: 1px solid var(--line-2); background: var(--bg); color: var(--text); border-radius: 8px; padding: 5px 8px; font: 500 16px var(--font); }
.ia-atualiza { display: block; font-size: 13px; color: var(--accent-text) !important; margin-top: 2px; }
.ia-atualiza.novo { color: var(--entra) !important; }
/* Atualizar saldos: o total dos aportes (diferença para o valor de hoje) no alto da conferência */
.ia-saldos-res { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; padding: 12px 14px; margin: 0 0 12px; border-radius: 14px; background: var(--card-2); }
.ia-saldos-res span { color: var(--text-2); }
.ia-saldos-res b { font: 600 20px/1.1 var(--font-d); margin-left: 4px; }
.ia-saldos-res small { flex-basis: 100%; color: var(--muted); font-size: 12.5px; }
.ia-saldos-btn { margin: 0 0 14px; }
.imp-saldos { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; text-align: left; }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* ---------- dicas de economia */
.dica { padding: 16px 0; border-top: 1px solid var(--line); }
.dica:first-of-type { border-top: 0; padding-top: 2px; }
.dica-cab { display: flex; align-items: flex-start; gap: 13px; }
.dica-ic {
  width: 42px; height: 42px; border-radius: 13px; flex: none; display: grid; place-items: center;
  background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good);
}
.dica-ic.alerta { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
.dica-t { flex: 1; min-width: 0; }
.dica-t b { display: block; font-size: 16px; font-weight: 600; line-height: 1.3; }
.dica-t span { display: block; color: var(--text-2); font-size: 14px; margin-top: 3px; }
.dica-v { text-align: right; font: 600 22px/1.05 var(--font-d); color: var(--good); white-space: nowrap; font-variant-numeric: tabular-nums; }
.dica-v i { display: block; font: 400 12px/1.2 var(--font); font-style: normal; color: var(--muted); }
.dica-v small { display: block; font: 400 13px/1.3 var(--font); color: var(--muted); margin-top: 2px; }
.dica-v.alerta { color: var(--danger); }
.dica-calc { display: flex; align-items: flex-start; gap: 6px; margin: 10px 0 0 55px; font-size: 13px; color: var(--text-2); }
.dica-calc .ic-s { color: var(--apo); flex: none; margin-top: 2px; }
.dica-fonte { display: flex; align-items: center; gap: 6px; margin: 6px 0 0 55px; font-size: 13px; color: var(--muted); }
.dica-fonte .ic-s { color: var(--good); flex: none; }
.dica-fonte a { color: var(--accent-text); }
.dica-acoes { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0 55px; }
.dica-conf { display: flex; align-items: center; gap: 12px; color: var(--text-2); font-size: 15px; }
.dica-conf .giro { width: 22px; height: 22px; border-width: 2px; flex: none; }
.dica-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
/* Mais: os botões de ação todos do mesmo tamanho, como nos outros apps. No celular ocupam a largura toda;
   do tablet para cima, a mesma largura fixa (no Exportar, ao lado do texto) */
.mais-painel .card > .btn:not(.peq), .mais-painel .opts .btn, .mais-painel .dica-btns .btn { width: 100%; flex: 1 1 100%; justify-content: center; }
@media (min-width: 600px) {
  .mais-painel .card > .btn:not(.peq), .mais-painel .opts .btn, .mais-painel .dica-btns .btn { width: 250px; flex: none; }
}
.ass-row { display: flex; align-items: flex-start; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ass-row .ini { width: 40px; height: 40px; border-radius: 12px; font-size: 18px; }
.ass-row .op-t span.ass-st { white-space: normal; color: var(--text-2); margin-top: 3px; }
.ass-row .op-t span.ass-st.ok { color: var(--good); }
.da-intro { margin: 0 0 16px; color: var(--text-2); }
.da-intro a { color: var(--accent-text); }
.cmp-anual { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-bottom: 18px; }
.cmp-anual div { background: var(--card-2); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.cmp-anual span { display: block; font-size: 13px; color: var(--muted); }
.cmp-anual b { display: block; font: 600 22px/1.15 var(--font-d); font-variant-numeric: tabular-nums; }
.cmp-anual small { display: block; font-size: 13px; color: var(--muted); }
.eco-linha { padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--good) 13%, transparent); color: var(--text); font-size: 15px; }
.eco-linha b { color: var(--good); }
@media (max-width: 380px) { .dica-calc, .dica-fonte, .dica-acoes { margin-left: 0; } }

/* ---------- aporte mensal */
.ini.apo .ic { width: 21px; height: 21px; }
.link-in { color: var(--accent-text); font: inherit; text-decoration: underline; text-underline-offset: 2px; padding: 0; background: none; border: 0; cursor: pointer; }

/* ---------- recebimento: créditos e descontos na fonte */
.desc-sec { border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: color-mix(in srgb, var(--card-2) 45%, transparent); }
.desc-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.desc-cab .lbl { margin: 0; }
.sub-lbl { font: 600 12px/1.2 var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 14px 0 8px; }
.parte-l { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; gap: 8px; align-items: center; margin-bottom: 8px; }
.parte-l .pref { margin: 0; }
.desc-ed { padding: 10px 12px; margin-bottom: 8px; }
.desc-l { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; margin-top: 8px; }
.desc-l .seg { margin: 0; }
.desc-l .seg button { min-width: 42px; }
.desc-l .pref { margin: 0; }
.desc-v { font: 600 17px/1 var(--font-d); color: var(--sai); white-space: nowrap; font-variant-numeric: tabular-nums; }
.desc-sel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 8px; }
.desc-sel.um { grid-template-columns: minmax(0, 1fr); }
.desc-sel select.inp { min-width: 0; }
.desc-res { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.desc-res > div span { display: block; font-size: 13px; color: var(--muted); }
.desc-res > div b { display: block; font: 600 18px/1.15 var(--font-d); white-space: nowrap; font-variant-numeric: tabular-nums; }
.desc-res > div b.sai { color: var(--sai); }
.desc-res .liq b { color: var(--entra); }
.desc-res .liq small { display: block; font-size: 12px; color: var(--muted); }
.desc-conf { grid-column: 1 / -1; display: flex; align-items: flex-start; gap: 6px; margin: 4px 0 0; font-size: 14px; }
.desc-conf.ok { color: var(--good); }
.desc-conf.erro { color: var(--danger); }
.desc-conf .ic-s { flex: none; margin-top: 2px; }
.pref.lido { background: var(--card-2); }
.pref.lido b { font: 600 22px/1 var(--font-d); padding: 14px 4px; font-variant-numeric: tabular-nums; }
.giro.mini { width: 14px; height: 14px; border-width: 2px; display: inline-block; vertical-align: -2px; margin-right: 6px; }
.desc-tog { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 4px 10px 58px; font-size: 14px; color: var(--muted); text-align: left; }
.desc-tog .ic-s { transition: transform .15s; flex: none; }
.desc-tog.on .ic-s { transform: rotate(90deg); }
.desc-tog span { flex: 1; }
.desc-tog b { font: 600 15px/1 var(--font-d); color: var(--sai); white-space: nowrap; }
.desc-itens { margin: -4px 0 8px 44px; border-left: 2px solid var(--line); }
.desc-ed .conta-l { margin-bottom: 0; }
.desc-ed2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; grid-template-areas: "n p x" "v v v"; gap: 6px 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.desc-ed2 > .inp { grid-area: n; }
.desc-ed2 > .pref { grid-area: p; margin: 0; }
.desc-ed2 > .icbtn { grid-area: x; }
.desc-ed2 > .desc-v { grid-area: v; justify-self: end; font-size: 15px; }
.lig-l { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.lig-l span { flex: 1; min-width: 0; }
.lig-l b { font: 600 16px/1 var(--font-d); color: var(--sai); white-space: nowrap; }
.lig-l .ic-s { color: var(--muted); flex: none; }
.lig-l input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.vinc-st { display: flex; align-items: center; gap: 6px; margin: 0; min-height: 50px; color: var(--text-2); font-size: 15px; }
.vinc-st .ic-s { color: var(--accent-text); flex: none; }

/* ---------- Mais: um menu, como no InventarIA (cada função na sua linha, Configurações por último) */
.menu-list { list-style: none; margin: 22px 0 0; padding: 0; border-top: 1px solid var(--line); }
.menu-row { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 76px; padding: 12px 4px; border-bottom: 1px solid var(--line); text-align: left; }
.menu-row:active { background: var(--card-2); }
@media (hover: hover) { .menu-row:hover { background: var(--card-2); } }
.menu-row .mb { flex: 1; min-width: 0; display: grid; gap: 2px; }
.menu-row b { font-size: 17px; font-weight: 600; }
.menu-row .mb span { color: var(--muted); font-size: 14px; line-height: 1.35; }
/* numa tela de Mais, o caminho de volta para o menu, no alto */
.uplink { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; margin: 8px 0 0 -6px; padding: 6px 10px 6px 4px; border-radius: 10px; color: var(--text-2); font-weight: 500; }
.uplink:active { background: var(--card-2); color: var(--text); }
@media (hover: hover) { .uplink:hover { background: var(--card-2); color: var(--text); } }
.uplink + .cab-linha h1 { margin-top: 2px; }

/* ---------- Configurações em abas, como no ResolvIA, no CronologIA e no InventarIA */
.mais-abas {
  position: sticky; top: 0; z-index: 15; display: flex; gap: 2px; padding: 4px; margin: 4px 0 18px;
  border-radius: 14px; background: var(--card-2); border: 1px solid var(--line); box-shadow: 0 0 0 8px var(--bg);
  overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.mais-abas::-webkit-scrollbar { display: none; }
.mais-abas button {
  flex: 1 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 10px;
  border-radius: 10px; color: var(--muted); font: 500 15px/1 var(--font); white-space: nowrap;
}
.mais-abas button:hover { color: var(--text); }
.mais-abas button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .18); }
:root[data-theme="dark"] .mais-abas button.on { background: #2c333d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mais-abas button.on { background: #2c333d; } }
.mais-abas .ic-s { width: 17px; height: 17px; }
@media (max-width: 600px) { .mais-abas .ic-s { display: none; } .mais-abas button { padding: 0 8px; font-size: 14.5px; } }
.mais-painel.abas { min-height: calc(100dvh - 160px); }
.mais-head { display: flex; align-items: center; gap: 12px; margin: 0 0 10px; }
.mais-head h2 { flex: 1; min-width: 0; margin: 0; font: 600 25px/1.1 var(--font-d); letter-spacing: .005em; }
.mais-ic { display: grid; place-items: center; flex: none; width: 38px; height: 38px; border-radius: 11px; background: color-mix(in srgb, var(--accent) 17%, transparent); color: var(--accent-text); }
.mais-ic .ic { width: 21px; height: 21px; }
.mais-aside { font: 600 17px/1 var(--font-d); color: var(--text-2); white-space: nowrap; }
.painel-lead { margin: 0 0 14px; color: var(--muted); font-size: 15px; max-width: 64ch; }
.painel-lead code, .card .linha-sw code { font-size: 13px; }
.card .linha-sw { padding: 12px 0; border-top: 1px solid var(--line); }
.card .mais-head + .linha-sw { border-top: 0; padding-top: 4px; }
.card .painel-lead + .linha-sw { margin-top: 2px; }
.foot { margin: 36px 0 8px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; }
.foot b { font: 600 19px/1.3 var(--font-d); letter-spacing: .01em; color: var(--text-2); }

/* ---------- Mais › Sobre: CorrerIA Code, os apps e o GitHub (a página do CronologIA, nas cores e fontes daqui) */
.sobre-topo {
  position: relative; overflow: hidden; text-align: center; padding: 30px 20px 26px; margin: 22px 0 18px;
  border-radius: var(--r-card); border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 0%, var(--accent-soft), transparent 70%), var(--card);
}
.sb-raio {
  display: inline-grid; place-items: center; width: 58px; height: 58px; border-radius: 18px; transform: rotate(-8deg);
  background: var(--accent); color: var(--on-accent); box-shadow: 0 10px 24px -12px var(--accent);
}
.sb-raio .ic { width: 30px; height: 30px; fill: currentColor; stroke-width: 1.4; }
.sb-nome { margin: 16px 0 4px; font: 700 38px/1.05 var(--font-d); color: var(--text); }
.sb-nome span, .sb-wm span { color: var(--accent-text); }
.sb-oque { margin: 0; color: var(--muted); font: 600 13px/1.4 var(--font); letter-spacing: .14em; text-transform: uppercase; }
@media (max-width: 360px) { .sb-oque { font-size: 11px; letter-spacing: .06em; } }
.sb-lema { margin: 14px 0 0; color: var(--text); font-size: 16px; font-style: italic; }
.sb-txt { margin: 0; color: var(--text); font-size: 15.5px; line-height: 1.55; }
.sb-apps { list-style: none; margin: 0; padding: 0; }
.sb-app { display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 10px 0; color: inherit; text-decoration: none; border-top: 1px solid var(--line); }
.sb-apps > li:first-child > .sb-app { border-top: 0; }
.sb-app .mb { flex: 1; min-width: 0; display: grid; gap: 2px; }
.sb-app b { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font: 600 20px/1.2 var(--font-d); }
.sb-app .mb > span { color: var(--muted); font-size: 14px; line-height: 1.35; }
.sb-ext { flex: none; width: 18px; height: 18px; color: var(--muted); }
.sb-aqui { padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font: 600 12px/1.3 var(--font); }
.sb-app:active { background: var(--card-2); }
@media (hover: hover) { .sb-app:hover b { color: var(--accent-text); } }
.sb-github { margin: 0 0 8px; }

/* tema: três botões iguais com o ícone em cima */
.seg.temas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; margin: 2px 0 2px; }
.seg.temas button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 66px; padding: 10px 4px 9px; font-size: 15px; }
.seg.temas button .ic { width: 22px; height: 22px; }
.seg.temas button.on .ic { color: var(--accent-text); }

/* cor do app: etiquetas com nome */
.tag-cores { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; margin: 0 -6px; }
@media (max-width: 520px) { .tag-cores { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tsw { --sw-bg: var(--card); position: relative; display: grid; justify-items: center; gap: 4px; padding: 8px 2px 7px; border-radius: 10px; background: var(--sw-bg); min-width: 0; -webkit-tap-highlight-color: transparent; }
@media (hover: hover) { .tsw:hover { --sw-bg: var(--card-2); } }
.tsw svg { width: 48px; height: 36px; overflow: visible; }
.tsw .sw-fill { fill: var(--a); fill-rule: evenodd; stroke: color-mix(in srgb, var(--a) 80%, #000); stroke-width: 1; }
.tsw .sw-ring, .tsw .sw-gap, .tsw .sw-check { fill: none; stroke-linejoin: round; stroke-linecap: round; visibility: hidden; }
.tsw .sw-ring { stroke: var(--text); stroke-width: 7; }
.tsw .sw-gap { stroke: var(--sw-bg); stroke-width: 3.6; }
.tsw .sw-check { stroke: rgba(20, 20, 20, .85); stroke-width: 2.4; }
.tsw span { font-size: 13px; line-height: 1.2; color: var(--muted); white-space: nowrap; }
.tsw.on .sw-ring, .tsw.on .sw-gap, .tsw.on .sw-check { visibility: visible; }
.tsw.on span { color: var(--text); font-weight: 600; }
.tsw:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }

/* backups na pasta share */
/* Exportar (como no InventarIA, no ResolvIA e no CronologIA): uma linha por arquivo, com borda entre elas */
.opts { list-style: none; margin: 0 0 4px; padding: 0; border-top: 1px solid var(--line); }
.opts > li { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; padding: 14px 2px; border-bottom: 1px solid var(--line); }
.opts .ot { flex: 1; min-width: 220px; }
.opts .ot b { display: block; font-weight: 600; font-size: 15.5px; }
.opts .ot span { display: block; margin-top: 2px; font-size: 13.5px; line-height: 1.4; color: var(--muted); }
.opts .btn { flex: none; }
.bk-lista { margin-top: 14px; border-top: 1px solid var(--line); }
.bk-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.bk-row > div { flex: 1; min-width: 0; }
.bk-row b { display: block; font: 600 17px/1.2 var(--font-d); }
.bk-row span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* uso da IA */
.uso-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 2px 0 14px; }
.uso-tile { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 10px 12px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); }
.uso-tile .uk { font: 600 12px/1.2 var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.uso-tile .v { font: 700 30px/1.05 var(--font-d); color: var(--text); font-variant-numeric: tabular-nums; }
.uso-tile .s { font-size: 12.5px; line-height: 1.3; color: var(--muted); }
.uso-tile .s.alerta { color: var(--danger); font-weight: 600; }
.uso-chart { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; align-items: end; height: 118px; padding-top: 6px; border-bottom: 1px solid var(--line); }
.uso-bar { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; padding: 0 4px; border-radius: 4px; -webkit-tap-highlight-color: transparent; }
.uso-bar i { display: block; width: 100%; max-width: 24px; min-height: 2px; border-radius: 4px 4px 0 0; background: color-mix(in srgb, var(--muted) 45%, transparent); transition: background .15s; }
.uso-bar[aria-pressed="true"] i { background: var(--accent); }
.uso-bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.uso-dias { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; padding-top: 5px; font-size: 12.5px; color: var(--muted); text-align: center; }
.uso-cap { margin: 0; padding: 8px 0 10px; min-height: 1.5em; font-size: 14px; color: var(--muted); }
.uso-cap b { color: var(--text); font-weight: 600; }
.uso-tipos { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; padding: 0; list-style: none; }
.uso-tipos li { padding: 3px 9px; border: 1px solid var(--line); border-radius: 7px; font-size: 13px; color: var(--muted); }
.uso-tipos b { color: var(--text); font-weight: 600; }
.uso-ult { margin: 0 0 6px; }
.uso-ult summary { display: inline-flex; align-items: center; gap: 6px; padding: 6px 0; color: var(--accent-text); font-weight: 600; cursor: pointer; list-style: none; }
.uso-ult summary::-webkit-details-marker { display: none; }
.uso-ult summary .ic-s { transition: transform .15s; }
.uso-ult[open] summary .ic-s { transform: rotate(90deg); }
.uso-ult ul { list-style: none; margin: 4px 0 0; padding: 0; }
.uso-ult li { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.uso-ult li b { color: var(--text); font-weight: 600; }
.uso-ult li .r-erro { color: var(--danger); font-weight: 600; }
.uso-ult li .t { flex-basis: 100%; font-size: 13px; }
.card .nota a { color: var(--accent-text); }
@media (prefers-reduced-motion: reduce) { .uso-bar i, .uso-ult summary .ic-s { transition: none; } }

/* Investimento cadastrado: Aplicar mais (aporte que soma ao valor de hoje) */
.inv-aplicar { display: flex; flex-direction: column; align-items: stretch; gap: 10px; margin: 0 0 20px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.inv-acoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); grid-auto-flow: column; gap: 10px; }
.inv-acoes .btn { width: 100%; }
.chips.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tr-para .chip small { color: var(--muted); font-size: .85em; }
.chip.on small { color: inherit; opacity: .75; }
.inv-aplicar span { color: var(--muted); font-size: 13.5px; line-height: 1.4; }

.dica-quando { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; color: var(--muted); font-size: 14px; }
.dica-quando .ic-s { width: 16px; height: 16px; }

/* Conferir o que a IA leu: lançamentos e investimentos na mesma janela */
.ia-sec { display: flex; align-items: center; gap: 8px; margin: 22px 0 12px; padding-top: 16px; border-top: 1px solid var(--line); font: 600 19px/1.2 var(--font-d); }
.ia-sec:first-of-type { margin-top: 4px; padding-top: 0; border-top: 0; }
.ia-sec .ic-s { color: var(--accent-text); }
.ia-pend { font-weight: 600; color: var(--terc); }

/* Adicionar: Ler com IA em quadrinhos tracejados no alto da janela (como no ResolvIA e no CronologIA) */
.imp-campo { padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.imp-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.imp-tiles.dois { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.imp-tile {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 88px; padding: 12px 8px;
  border: 1.5px dashed var(--line-2); border-radius: 14px; color: var(--text); font: 500 14px/1.25 var(--font); text-align: center;
}
.imp-tile .ic { width: 22px; height: 22px; color: var(--accent-text); }
.imp-tile:hover, .imp-tile:focus-visible { border-color: var(--text-2); background: var(--card-2); }
.imp-tile:active { background: var(--card-2); }
.imp-ajuda { margin: 10px 0 0; color: var(--muted); font-size: 13.5px; }
.imp-tile small { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 400; }
/* com Falar são quatro: dois por linha, ícone ao lado do texto */
.imp-tiles.quatro { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.imp-tiles.quatro .imp-tile { flex-direction: row; justify-content: flex-start; gap: 10px; min-height: 60px; padding: 10px 12px; text-align: left; }
.imp-tiles.quatro .imp-tile .ic { flex: none; }

/* Digitalizar com IA: a câmera em tela cheia (como no ResolvIA) */
.cam { position: fixed; inset: 0; z-index: 70; background: #000; color: #fff; display: flex; flex-direction: column; }
.cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cam-ui { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.cam-flash { position: absolute; inset: 0; background: #fff; pointer-events: none; animation: cam-flash .35s ease-out both; }
@keyframes cam-flash { from { opacity: .85; } to { opacity: 0; } }
.cam-top { display: flex; align-items: center; justify-content: space-between; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; background: linear-gradient(rgba(0,0,0,.55), transparent); }
.cam-titulo { font: 600 21px/1.2 var(--font-d); }
.cam-btn { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.35); color: #fff; }
.cam-btn.on { background: #ffd54a; color: #1d1608; }
.cam-btn.vazio { background: none; }
.cam-moldura { position: relative; flex: 1; margin: 18px 26px 6px; pointer-events: none; }
.cam-moldura i { position: absolute; width: 38px; height: 38px; border: 4px solid rgba(255,255,255,.92); filter: drop-shadow(0 1px 3px rgba(0,0,0,.5)); }
.cam-moldura i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 14px 0 0 0; }
.cam-moldura i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 14px 0 0; }
.cam-moldura i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 14px; }
.cam-moldura i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 14px 0; }
.cam-dica { text-align: center; margin: 6px 24px 10px; font-size: 15px; font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
.cam-msg { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 32px; text-align: center; font-size: 16px; line-height: 1.5; }
.cam-msg > .ic { width: 44px; height: 44px; opacity: .8; }
.cam-msg p { margin: 0; }
.cam-baixo { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 18px 20px calc(22px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, rgba(0,0,0,.6)); }
.cam-fotos { display: flex; align-items: center; }
.cam-fotos img { width: 44px; height: 56px; object-fit: cover; border-radius: 8px; border: 2px solid #fff; margin-right: -18px; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
.cam-fotos span { margin-left: 24px; font-weight: 600; font-size: 14px; }
.cam-disparo { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center; }
.cam-disparo span { width: 60px; height: 60px; border-radius: 50%; background: var(--accent); transition: transform .1s; }
.cam-disparo:active span { transform: scale(.88); }
.cam-disparo:disabled { opacity: .4; }
.cam-pronto { justify-self: end; padding: 12px 16px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 15px; }
.cam-pronto:disabled { background: rgba(255,255,255,.18); color: rgba(255,255,255,.6); }

/* IA desligada em Mais › Configurações › Integrações: os botões de IA somem */
[data-ia="off"] [data-a="ia"], [data-ia="off"] .imp-campo, [data-ia="off"] [data-a="lf-ler-recibo"], [data-ia="off"] [data-a="ia-saldos"] { display: none !important; }

/* ---------- Falar: o microfone no alto de cada tela, à direita (como no CronologIA e no ResolvIA) */
.cab { display: block; }
.cab-topo { display: flex; align-items: center; gap: 10px; min-height: 26px; }
.cab-topo .eyebrow { flex: 1; min-width: 0; }
.cab-linha { display: flex; align-items: flex-end; gap: 4px; }
.cab-linha h1 { flex: 1; min-width: 0; }
.mic-top { flex: none; width: 44px; height: 44px; margin: -6px -2px -6px 0; border-radius: 50%; display: grid; place-items: center;
  background: color-mix(in srgb, var(--accent) 17%, transparent); color: var(--accent-text); }
.mic-top .ic { width: 22px; height: 22px; }
.mic-top:active { transform: scale(.94); }
.voz { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 22px 8px 8px; text-align: center; }
.voz-mic { position: relative; width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #0b0f14;
  box-shadow: 0 6px 22px color-mix(in srgb, var(--accent) 35%, transparent); }
.voz-mic .ic { position: relative; width: 40px; height: 40px; }
.voz-anel { position: absolute; inset: -10px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 22%, transparent);
  transform: scale(calc(.85 + var(--lvl, 0) * .45)); transition: transform .12s ease-out; }
.voz.on .voz-anel { animation: respira 1.6s ease-in-out infinite; }
@keyframes respira { 50% { opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .voz-anel { transition: none; } .voz.on .voz-anel { animation: none; } }
.voz-estado { font: 600 21px/1.2 var(--font-d); margin-top: 6px; }
.voz-tempo { color: var(--muted); font-variant-numeric: tabular-nums; }
.voz-dica { margin: 0; max-width: 34ch; color: var(--muted); font-size: 14px; line-height: 1.45; }
.ouvido { display: flex; align-items: flex-start; gap: 8px; margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: var(--card-2); font-size: 14.5px; line-height: 1.4; }
.ouvido .ic-s { flex: none; margin-top: 2px; color: var(--accent-text); }

/* ---------- computador (1000 px ou mais), como no ResolvIA, no CronologIA e no InventarIA:
   barra lateral no lugar das abas de baixo, ações no alto à direita, seções na página (sem cartões)
   com título grande e ícone, os números ao lado do placar, dois grupos lado a lado e as janelas no meio.
   No celular e no tablet nada muda: os invólucros abaixo somem (display: contents). */
:root { --side-w: 272px; }
#lado, .top-acts { display: none; }
.ini-g, .ini-ga, .ini-gb, .cx-duas, .cx-lado, .cx-lista, .inv-filtros, .inv-lista { display: contents; }
.comps { margin-top: 8px; }

.side-brand { font: 700 25px/1 var(--font-d); padding: 4px 10px 18px; color: var(--text); }
.side-brand span { color: var(--accent-text); }
.side-nav, .side-lista { display: grid; gap: 2px; }
.side-link, .side-item {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 40px; padding: 8px 10px;
  border-radius: 10px; text-align: left; color: var(--text); font-weight: 500;
}
.side-link .ic { width: 20px; height: 20px; color: var(--muted); }
.side-link:hover, .side-item:hover { background: var(--card-2); }
.side-link[aria-current="page"], .side-item[aria-current="page"] { background: var(--card); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
.side-link[aria-current="page"] .ic { color: var(--accent-text); }
.side-link kbd { margin-left: auto; font: 500 12px/1 var(--font); color: var(--muted); border: 1px solid var(--line-2); border-radius: 5px; padding: 3px 6px; }
.side-badge {
  margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 11px; background: var(--danger); color: #fff;
  font: 600 13px/20px var(--font-d); text-align: center; font-variant-numeric: tabular-nums;
}
.side-h { display: flex; align-items: baseline; justify-content: space-between; padding: 22px 10px 8px; }
.side-h span { font: 600 17px/1.2 var(--font-d); color: var(--text); }
.side-h small { font-size: 13px; color: var(--muted); }
.side-item { min-height: 38px; padding: 5px 10px; font-weight: 400; }
.side-tile {
  width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none;
  background: color-mix(in srgb, var(--c) 22%, transparent); color: var(--c); font: 700 14px/1 var(--font-d);
}
.side-tile.terc { --c: var(--terc); }
.sl-nome { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sl-num { font: 500 15px/1 var(--font-d); color: var(--muted); font-variant-numeric: tabular-nums; }
.side-foot { margin: auto 0 0; padding: 18px 10px 0; font-size: 13px; color: var(--muted); }

@media (min-width: 1000px) {
  body { padding-left: var(--side-w); }
  #lado {
    display: flex; flex-direction: column; gap: 2px; position: fixed; inset: 0 auto 0 0; z-index: 30; width: var(--side-w);
    padding: 22px 14px 18px; overflow-y: auto; border-right: 1px solid var(--line); background: var(--bg); scrollbar-width: thin;
  }
  #nav { display: none; }
  #app { max-width: 1040px; padding: 28px 40px 72px; }

  /* cabeçalho: o nome do app fica na barra lateral ("Olá, Diego" continua); as ações no alto à direita */
  .eyebrow .brand, .eyebrow .eb-sep { display: none; }
  .cab { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 20px; align-items: start; }
  .cab-topo { grid-column: 1; grid-row: 1; min-height: 18px; }
  .cab-linha { grid-column: 1; grid-row: 2; }
  .cab > .uplink { grid-column: 1; grid-row: 2; justify-self: start; }
  .cab > .uplink + .cab-linha { grid-row: 3; }
  .cab:has(> .uplink) > .top-acts { grid-row: 1 / span 3; }
  .cab-topo > .mic-top, .cab-linha > .icbtn { display: none; }
  .cab h1 { margin-top: 8px; font-size: 46px; }
  .top-acts { grid-column: 2; grid-row: 1 / span 2; display: flex; align-items: center; gap: 8px; }
  .top-acts .btn { min-height: 40px; padding: 0 16px; border-radius: 10px; }
  .top-acts .btn:not(.pri) { background: transparent; }
  .top-acts .mic-top { margin: 0; width: 40px; height: 40px; }
  .top-acts .icbtn { width: 40px; height: 40px; }
  .top-acts .icbtn:hover { background: var(--card-2); }
  .sync { margin: 12px 0 28px; }

  /* seções na página, sem cartão: título grande com o ícone e uma linha entre as linhas */
  #app .card, #app .graf-card { background: none; border: 0; border-radius: 0; padding: 0 !important; margin: 0 0 40px; box-shadow: none; overflow: visible; }
  #app .card.flush > .rot, #app .cx-card .rot { padding: 0; }
  #app .card .rot, #app .g-tit { margin: 0; padding: 0 0 12px; border-bottom: 1px solid var(--line); font-size: 25px; }
  #app .g-tit { margin-bottom: 16px; }
  #app .rot-ic { width: 38px; height: 38px; border-radius: 11px; }
  #app .rot-ic .ic { width: 21px; height: 21px; }
  #app .card .op { padding: 13px 8px; border-top: 0; border-bottom: 1px solid var(--line); }
  #app .op:hover, .hl-row:hover, .cx-card-pe:hover, .comp:hover { background: var(--card-2); }
  #app .cx-card .cx-resumo { border-top: 0; }
  #app .cx-card-pe { padding: 12px 8px; }
  #app .card.dicas .dica:first-of-type { padding-top: 16px; }
  #app details.card { margin-top: 0 !important; }
  .sobre-topo { margin: 24px 0 40px; } /* o cartão do alto fica; as seções embaixo, direto na página */
  .stat-duo { margin: 0 0 16px; }
  .graf-card .leg, .graf-card .linha-sw, .graf-card .sep { margin-left: 0 !important; margin-right: 0 !important; }

  /* Início: o placar com os números ao lado e, abaixo, dois grupos lado a lado */
  .ini-g { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); grid-template-areas: "p h" "a b"; gap: 0 40px; align-items: start; }
  .ini-g.so-caixa { grid-template-areas: "p b" "a b"; }
  .ini-g > .placar { grid-area: p; align-self: center; margin: 0 0 40px; }
  .ini-g > .hl { grid-area: h; align-self: center; margin: 0 0 40px; }
  .ini-ga { display: block; grid-area: a; min-width: 0; }
  .ini-gb { display: block; grid-area: b; min-width: 0; }
  .hl-row { padding: 10px 6px; }
  .hl-n { font-size: 21px; }

  /* Caixa: a lista à esquerda e o mês (números e saldo) à direita, parado na tela */
  .cx-duas { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 0 40px; align-items: start; }
  .cx-lado { display: block; grid-column: 2; grid-row: 1; position: sticky; top: 24px; }
  .cx-lista { display: block; grid-column: 1; grid-row: 1; min-width: 0; }
  .cx-lado .cx-saldo { flex-wrap: wrap; margin: 18px 2px 0; }
  .cx-lista > .chips:first-child { margin-bottom: 4px; }
  .dia-cab { margin: 22px 0 0; padding: 0 8px 8px; border-bottom: 1px solid var(--line); }
  .lanc { background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; margin: 0; padding: 11px 8px; }
  .lanc:hover { background: var(--card-2); }
  .lanc.fatura, .lanc.fatura.aberta { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; margin: 0; }
  .fatura-itens { border: 0; border-left: 3px solid var(--line-2); border-radius: 0; margin: 0 0 0 26px; padding: 0 0 0 10px; }
  .comps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; }
  .comps .comp:last-child { border-bottom: 1px solid var(--line); }

  /* Invest: a busca ao lado do filtro e os investimentos em duas colunas */
  .inv-filtros { display: block; margin-bottom: 14px; }
  .inv-filtros > * { margin: 0; }
  .inv-lista { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .inv-lista .inv { margin: 0; }
  .inv:hover { background: var(--card-2); }

  /* as janelas viram uma janela no meio da tela */
  .folha {
    left: var(--side-w); right: 0; top: 0; bottom: 0; height: fit-content; max-height: 86vh; margin: auto; width: calc(100% - var(--side-w) - 64px);
    border-radius: 24px; opacity: 0; transform: translateY(14px) scale(.98); transition: opacity .18s, transform .22s cubic-bezier(.2, .8, .2, 1);
  }
  .folha.on { opacity: 1; transform: none; }
  .folha-pe { padding-bottom: 14px; }
  #toast { left: calc(50% + var(--side-w) / 2); bottom: 24px; }
}
/* no tema claro, a letra do banco na barra lateral fica mais escura para ler bem */
:root[data-theme="light"] .side-tile { color: color-mix(in srgb, var(--c) 55%, #000); background: color-mix(in srgb, var(--c) 26%, transparent); }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) .side-tile { color: color-mix(in srgb, var(--c) 55%, #000); background: color-mix(in srgb, var(--c) 26%, transparent); }
}

/* ---------- telas grandes (monitor Full HD, 2K, 4K): mais largo e tudo maior, para aproveitar a tela.
